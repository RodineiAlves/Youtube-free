<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeFree</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f0f; color: #fff; padding: 15px; }
    header { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 12px 20px; border-radius: 20px; border: none; background: #ff0000; color: #fff; font-weight: bold; cursor: pointer; }
    #player-container { margin-bottom: 20px; display: none; }
    iframe { width: 100%; height: 250px; border: none; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: #181818; border-radius: 8px; overflow: hidden; cursor: pointer; }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-title { font-size: 14px; font-weight: bold; line-height: 1.3; }
  </style>
</head>
<body>

  <header>
    <input type="text" id="query" placeholder="Pesquisar vídeo...">
    <button onclick="searchVideos()">Buscar</button>
  </header>

  <div id="player-container">
    <iframe id="player" allowfullscreen allow="autoplay"></iframe>
  </div>

  <div class="grid" id="results"></div>

  <script>
    const API_URL = "https://pipedapi.kavin.rocks";

    async function searchVideos() {
      const q = document.getElementById('query').value;
      if (!q) return;
      
      const res = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}&filter=all`);
      const data = await res.json();
      
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      data.items.filter(item => item.type === 'stream').forEach(video => {
        const videoId = video.url.split('v=')[1];
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playVideo(videoId);
        card.innerHTML = `
          <img src="${video.thumbnail}" />
          <div class="card-info">
            <div class="card-title">${video.title}</div>
          </div>
        `;
        resultsDiv.appendChild(card);
      });
    }

    function playVideo(id) {
      const container = document.getElementById('player-container');
      const player = document.getElementById('player');
      container.style.display = 'block';
      player.src = `https://piped.video/embed/${id}?autoplay=1`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
